name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A new push supersedes the one still running - do not keep a stale web build alive.
concurrency:
  group: build-and-deploy
  cancel-in-progress: true

jobs:
  # 내보내기와 Pages 배포를 한 잡으로 — 아티팩트 왕복과 잡 스핀업이 통째로 사라진다.
  build-deploy-web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true

      - name: Restore import cache
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-web-${{ hashFiles('project.godot', 'assets/**/*.import') }}
          restore-keys: |
            godot-import-web-
            godot-import-

      - name: Validate project
        run: godot --headless --path . --editor --quit

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web"

      # PWA는 껐지만, 이미 폰에 등록된 옛 서비스워커가 캐시된 구버전을 계속
      # 서빙한다. 같은 URL에 '자폭 워커'를 배포해 캐시를 지우고 스스로 해제시킨다.
      - name: Deploy self-destructing service worker
        run: |
          cat > build/web/index.service.worker.js <<'SW'
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', (event) => {
            event.waitUntil((async () => {
              const keys = await caches.keys();
              await Promise.all(keys.map((key) => caches.delete(key)));
              await self.registration.unregister();
              const clients = await self.clients.matchAll({ type: 'window' });
              clients.forEach((client) => client.navigate(client.url));
            })());
          });
          SW

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 폰 알림: ntfy 앱에서 아래 토픽을 구독하면 성공/실패가 푸시로 온다.
      # 토픽은 사실상 비밀번호다 — 바꾸면 앱 구독도 같이 바꿀 것.
      - name: Notify phone (ntfy)
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            curl -s -H "Title: GREY DAWN deploy" -H "Tags: white_check_mark" \
              -d "배포 완료 — steeee2l.github.io/GodotProject 새로고침" \
              ntfy.sh/greydawn-deploy-s2l-9x4k
          else
            curl -s -H "Title: GREY DAWN deploy" -H "Tags: x" -H "Priority: high" \
              -d "빌드 실패 — Actions 로그 확인 필요" \
              ntfy.sh/greydawn-deploy-s2l-9x4k
          fi

  # Windows 빌드는 배포처가 없다 — 매 푸시마다 돌리지 않고 수동 실행 전용.
  build-windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true

      - name: Restore import cache
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-windows-${{ hashFiles('project.godot', 'assets/**/*.import') }}
          restore-keys: |
            godot-import-windows-
            godot-import-

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows
