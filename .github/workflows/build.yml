name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A new push supersedes the one still running - do not keep a stale web build alive.
concurrency:
  group: build-and-deploy
  cancel-in-progress: true

jobs:
  # 내보내기와 Pages 배포를 한 잡으로 — 아티팩트 왕복과 잡 스핀업이 통째로 사라진다.
  build-deploy-web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true

      - name: Restore import cache
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-web-${{ hashFiles('project.godot', 'assets/**/*.import') }}
          restore-keys: |
            godot-import-web-
            godot-import-

      - name: Validate project
        run: godot --headless --path . --editor --quit

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Windows 빌드는 배포처가 없다 — 매 푸시마다 돌리지 않고 수동 실행 전용.
  build-windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true

      - name: Restore import cache
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-windows-${{ hashFiles('project.godot', 'assets/**/*.import') }}
          restore-keys: |
            godot-import-windows-
            godot-import-

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows
